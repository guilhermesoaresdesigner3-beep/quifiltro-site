<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" fill="none" class="w-full h-full" role="img" aria-label="Mapa de Angola">
  <defs>
    <linearGradient id="angolaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4F0" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0A4BB5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#062E73" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="strokeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4F0" />
      <stop offset="100%" stop-color="#1E7BFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Enclave de Cabinda -->
  <path
    d="M 230 65 L 265 60 L 270 82 L 250 95 L 235 90 Z"
    fill="url(#angolaGradient)"
    stroke="url(#strokeGradient)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <text x="280" y="80" fill="#00B4F0" font-size="14" font-weight="600" font-family="Montserrat, sans-serif">Cabinda</text>

  <!-- Território Continental de Angola -->
  <!-- Contorno exterior oficial simplificado de Angola -->
  <path
    d="M 270 120 
       C 290 125, 330 135, 380 130 
       C 430 125, 470 145, 520 155 
       C 570 165, 620 190, 640 230 
       C 655 260, 630 300, 645 340 
       C 660 380, 710 400, 715 450 
       C 720 500, 680 540, 650 565 
       C 610 595, 560 610, 500 610 
       C 430 610, 370 605, 320 615 
       C 285 622, 255 580, 245 540 
       C 238 505, 250 470, 255 430 
       C 260 390, 250 350, 240 310 
       C 230 270, 245 230, 252 190 
       C 256 160, 262 135, 270 120 Z"
    fill="url(#angolaGradient)"
    stroke="url(#strokeGradient)"
    stroke-width="3"
    stroke-linejoin="round"
    filter="drop-shadow(0 8px 24px rgba(0, 180, 240, 0.25))"
  />

  <!-- Rede de linhas de distribuição sutil conectando a Talatona/Luanda -->
  <g stroke="#00B4F0" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.45">
    <!-- Centro em Luanda (255, 205) -->
    <line x1="255" y1="205" x2="250" y2="85" />
    <line x1="255" y1="205" x2="380" y2="230" />
    <line x1="255" y1="205" x2="330" y2="340" />
    <line x1="255" y1="205" x2="450" y2="330" />
    <line x1="255" y1="205" x2="570" y2="260" />
    <line x1="255" y1="205" x2="620" y2="440" />
    <line x1="255" y1="205" x2="480" y2="490" />
    <line x1="255" y1="205" x2="300" y2="520" />
  </g>

  <!-- Pontos nas regiões-chave -->
  <circle cx="380" cy="230" r="4.5" fill="#00B4F0" />
  <circle cx="330" cy="340" r="4.5" fill="#00B4F0" />
  <circle cx="450" cy="330" r="4.5" fill="#00B4F0" />
  <circle cx="570" cy="260" r="4.5" fill="#00B4F0" />
  <circle cx="620" cy="440" r="4.5" fill="#00B4F0" />
  <circle cx="480" cy="490" r="4.5" fill="#00B4F0" />
  <circle cx="300" cy="520" r="4.5" fill="#00B4F0" />

  <!-- Sede: Talatona / Luanda (Marcador com gota d'água iluminada) -->
  <g transform="translate(255, 200)" filter="url(#glow)">
    <!-- Pulso concêntrico -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#00B4F0" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="12;28" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <!-- Gota Quifiltro -->
    <path
      d="M 0 -14 C 0 -14 -9 0 -9 7 C -9 12 -4 16 0 16 C 4 16 9 12 9 7 C 9 0 0 -14 0 -14 Z"
      fill="#FFFFFF"
      stroke="#00B4F0"
      stroke-width="2"
    />
    <circle cx="0" cy="7" r="3" fill="#00B4F0" />
    <text x="18" y="10" fill="#FFFFFF" font-size="15" font-weight="700" font-family="Montserrat, sans-serif">Talatona · Luanda</text>
  </g>
</svg>
